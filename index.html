<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Butterfly Effect - WIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="mainNav">
    <button class="logo" id="navToggle" aria-label="Toggle Navigation">
        <img src="images/spiralmenu.png" alt="Spiral Logo">
    </button>
    <ul class="navLinks">
        <li><a href="#hero">Start</a></li>
        <li><a href="#arcadia">Arcadia</a></li>
        <li><a href="#story-break">Story</a></li>
        <li><a href="#gallery">Photos</a></li>
        <li><a href="#game-choice">Choice</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><button id="themeToggle" class="themeToggle" aria-label="Toggle Dark/Light Mode">🌓</button></li>
    </ul>
</nav>

 <header id="hero" class="heroSection">
    <div class="heroImageContainer">
        <img src="images/bucket.png" alt="Bucket Background" class="heroBgImage">
        <div class="butterflyBox" onclick="flyAway()">
            <img src="images/butterfly.png" alt="blue butterfly" class="butterflyImg">
        </div>
    </div>

    <div class="heroText">
        <h1>Placeholder</h1>
        <p>Placeholder</p>
    </div>
</header>
    
    <section id="arcadia" class="arcadiaSection">
    <img src="images/arcadiabay.jpg" class="fullScreenImg" alt="Arcadia Bay">
    
    <div class="signHotspot" id="signHotspot"></div>
    
    <img src="images/arcadiabayoutline.png" class="fullScreenOutline" alt="Sign Outline">

    <div class="arcadiaInfo">
        <h2>Placeholder</h2>
        <p>Placeholder</p>
    </div>

    <div class="inspectSubtitle" id="inspectSubtitle">
        <p>"Placeholder"</p>
    </div>
</section>

    <section id="story-break" class="storySection">
        <div class="storyContent">
            <p>Placeholder</p>
            <p>Placeholder</p>
        </div>
    </section>

    <section id="gallery" class="gallerySection">
        <div class="galleryContainer">
            <img src="images/polaroid1.jpg" class="polaroid p1" alt="Chloe Price">
            <img src="images/polaroid2.jpg" class="polaroid p2" alt="Max Caulfield">
            <img src="images/polaroid3.jpg" class="polaroid p3" alt="Kate Marsh">
            <img src="images/polaroid4.jpg" class="polaroid p4" alt="Max and Warren">
            <img src="images/polaroid5.jpg" class="polaroid p5" alt="Stranded Whale">
            <img src="images/polaroid6.jpg" class="polaroid p6" alt="Diner">
        </div>
    </section>

    <section id="game-choice" class="choiceSection">
        <div class="consequenceAlert">
            <p>This action will have consequences...</p>
        </div>

        <div class="choiceWrapper">
            <div class="combinedVignette"></div>
            
            <div class="choiceSide stayDream">
                <img src="images/dream.png" alt="Live in the memory" class="choiceBg">
                <div class="choiceOverlay"></div>
                <button class="choiceLabel">Live in the memory</button>
            </div>
            
            <div class="choiceSide wakeUp">
                <img src="images/wakeup.png" alt="Wake Up" class="choiceBg">
                <div class="choiceOverlay"></div>
                <button class="choiceLabel">Wake up</button>
            </div>
        </div>
    </section>

    <div class="consequenceDivider">
        <p>Consequences are unfolding...</p>
    </div>

    <section id="contact" class="contactSection">
        <div class="contactUiContainer">
            <img src="images/contactreg.png" alt="Contact Background" class="contactImage">
            
            <div class="contactVignette"></div>
            
            <form class="contactOverlayForm">
                <input type="email" class="invisibleField emailOverlay" placeholder="email address" required>
                <textarea class="invisibleField messageOverlay" placeholder="your message" required></textarea>
                <button type="submit" class="invisibleSubmit"></button>
            </form>
        </div>
    </section>

<script src="script.js"></script>
</body>
</html>
